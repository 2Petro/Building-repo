name: Build llama.cpp Snapdragon Android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            docker-ce \
            git \
            build-essential \
            bc \
            bison \
            flex \
            openssl \
            libssl-dev

      - name: Clone llama.cpp
        run: |
          git clone https://github.com/ggml-org/llama.cpp.git

      - name: Build Snapdragon Android
        run: |
          cd llama.cpp
          ./scripts/snapdragon/build.py --target adb

      - name: Package build
        run: |
          tar -czf llama-cpp-snapdragon-android.tar.gz \
            -C llama.cpp/pkg-adb llama.cpp

      - name: Get version
        id: version
        run: |
          echo "version=$(date -u +'%Y.%m.%d-%H%M')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: snapdragon-${{ steps.version.outputs.version }}
          name: llama.cpp Snapdragon Android ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            llama-cpp-snapdragon-android.tar.gz
